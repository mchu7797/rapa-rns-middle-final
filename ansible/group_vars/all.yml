---
# ============================================================================
#  모든 장비 공통 변수
# ============================================================================

# --- 연결(network_cli over SSH) ---
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.ios.ios
ansible_user: "{{ vault_ansible_user | default('admin') }}"
ansible_password: "{{ vault_ansible_password | default('admin') }}"
ansible_become: true
ansible_become_method: enable
ansible_become_password: "{{ vault_enable_password | default('admin') }}"

# --- OSPF 공통 (모든 라우터가 process 1 / prefix-suppression 동일) ---
ospf_process_id: 1
ospf_prefix_suppression: true

# --- BGP 공통 ---
bgp_log_neighbor_changes: true
