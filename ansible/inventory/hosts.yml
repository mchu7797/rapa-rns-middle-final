---
# ============================================================================
#  통신사 네트워크 인벤토리
#  - 사업자(AS)별로 그룹을 나누고, BGP 속성은 group_vars 로 상속한다.
#  - ansible_host 는 OOB 관리망(예: 192.168.99.0/24) 주소로, 실습 환경에 맞게 수정.
#  - LG 는 BGP Confederation 이므로 서브 AS(65535/65536) 단위 하위 그룹으로 분리.
# ============================================================================
all:
  children:
    routers:
      children:
        # ---------------- AT&T : Global SP (AS 123) ----------------
        att:
          children:
            att_p:        # P (Provider) = Route Reflector
              hosts:
                R1: { ansible_host: 192.168.99.11 }
                R2: { ansible_host: 192.168.99.12 }
            att_pe:       # PE (Provider Edge) = RR Client
              hosts:
                R3: { ansible_host: 192.168.99.13 }
                R4: { ansible_host: 192.168.99.14 }
                R5: { ansible_host: 192.168.99.15 }
                R6: { ansible_host: 192.168.99.16 }
                R7: { ansible_host: 192.168.99.17 }
                R8: { ansible_host: 192.168.99.18 }

        # ---------------- KT : Local SP (AS 1111) ----------------
        kt:
          hosts:
            KT_1: { ansible_host: 192.168.99.21 }
            KT_2: { ansible_host: 192.168.99.22 }
            KT_3: { ansible_host: 192.168.99.23 }
            KT_4: { ansible_host: 192.168.99.24 }
            KT_5: { ansible_host: 192.168.99.25 }
            KT_6: { ansible_host: 192.168.99.26 }

        # ---------------- LG : Local SP (AS 1112, Confederation) ----------------
        lg:
          children:
            lg_as65535:
              hosts:
                LG_1: { ansible_host: 192.168.99.31 }
                LG_2: { ansible_host: 192.168.99.32 }
                LG_3: { ansible_host: 192.168.99.33 }
            lg_as65536:
              hosts:
                LG_4: { ansible_host: 192.168.99.34 }

        # ---------------- Google : Global CP (AS 1234) ----------------
        global_cp:
          hosts:
            GOOGLE: { ansible_host: 192.168.99.40 }

    # IXP L2 스위치 — L3/라우팅 설정이 없어 자동화 범위 밖(문서화 목적만 등록)
    fabric:
      hosts:
        INTER_PEERING: { ansible_host: 192.168.99.50 }
