# KT_4 — KT User 서브넷 수용
interfaces:
  - { name: Loopback0,   ipv4: 121.160.0.4,   mask: 255.255.255.255, description: "Router-ID" }
  - { name: Ethernet0/0, ipv4: 121.160.42.81, mask: 255.255.255.252, ospf_network: point-to-point }
  - { name: Ethernet0/3, ipv4: 121.160.42.66, mask: 255.255.255.252, ospf_network: point-to-point }
  - { name: Ethernet1/0, ipv4: 121.160.2.126, mask: 255.255.255.192, description: "KT User Subnet GW" }

ospf_networks:
  - { prefix: 121.160.0.4,  wildcard: 0.0.0.0,   area: 0 }
  - { prefix: 121.160.42.0, wildcard: 0.0.0.255, area: 0 }

bgp_networks:
  - { prefix: 121.160.2.64, mask: 255.255.255.192 }
bgp_neighbors:
  - { ip: 121.160.0.6, remote_as: 1111, update_source: Loopback0, next_hop_self: true, description: "iBGP to KT_6 (RR)" }
