hostname: LG_4

# LG_4 is the second confederation sub-AS (65536); override the group defaults.
bgp_as: "65536"
lg_confederation_peers: "65535"

interfaces:
  config:
    - name: Loopback0
      description: LG_4_Loopback
      enabled: true
    - name: Ethernet0/1
      description: TO_LG_3
      enabled: true
    - name: Ethernet0/2
      description: TO_LG_2
      enabled: true
    # unused ports
    - name: Ethernet2/0
      enabled: false
    - name: Ethernet2/1
      enabled: false
    - name: Ethernet2/2
      enabled: false
    - name: Ethernet2/3
      enabled: false

l3_interfaces:
  config:
    - name: Loopback0
      ipv4:
        - address: 63.250.0.4/32
    - name: Ethernet0/1
      ipv4:
        - address: 63.250.124.205/30
    - name: Ethernet0/2
      ipv4:
        - address: 63.250.124.201/30

ospfv2:
  config:
    processes:
      - process_id: 1
        prefix_suppression: true
        network:
          - address: 63.250.0.4
            wildcard_bits: 0.0.0.0
            area: "0"
          - address: 63.250.124.0
            wildcard_bits: 0.0.0.255
            area: "0"

bgp_global:
  config:
    as_number: "{{ bgp_as }}"
    bgp:
      log_neighbor_changes: true
      confederation:
        identifier: "{{ lg_confederation_identifier }}"
        peers: "{{ lg_confederation_peers }}"
    neighbors:
      - neighbor_address: 63.250.0.2
        remote_as: "65535"
        update_source: Loopback0
        ebgp_multihop:
          enable: true
          hop_count: 2
        next_hop_self:
          set: true
      - neighbor_address: 63.250.0.3
        remote_as: "65535"
        update_source: Loopback0
        ebgp_multihop:
          enable: true
          hop_count: 2
        next_hop_self:
          set: true
