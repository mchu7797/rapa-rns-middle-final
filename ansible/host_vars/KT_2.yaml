hostname: KT_2

interfaces:
  config:
    - name: Loopback0
      description: KT_2_Loopback
      enabled: true
    - name: Ethernet0/0
      description: TO_KT_3
      enabled: true
    - name: Ethernet0/1
      description: TO_KT_1
      enabled: true
    - name: Ethernet0/2
      description: TO_KT_6
      enabled: true
    - name: Ethernet0/3
      description: TO_KT_4
      enabled: true
    - name: Ethernet1/0
      description: CUSTOMER_121.160.1.0
      enabled: true
    # unused ports
    - name: Ethernet2/0
      enabled: false
    - name: Ethernet2/1
      enabled: false
    - name: Ethernet2/2
      enabled: false
    - name: Ethernet2/3
      enabled: false

l3_interfaces:
  config:
    - name: Loopback0
      ipv4:
        - address: 121.160.0.2/32
    - name: Ethernet0/0
      ipv4:
        - address: 121.160.42.9/30
    - name: Ethernet0/1
      ipv4:
        - address: 121.160.42.2/30
    - name: Ethernet0/2
      ipv4:
        - address: 121.160.42.29/30
    - name: Ethernet0/3
      ipv4:
        - address: 121.160.42.65/30
    - name: Ethernet1/0
      ipv4:
        - address: 121.160.1.1/30

ospf_interfaces:
  config:
    - name: Ethernet0/0
      address_family:
        - afi: ipv4
          network:
            point_to_point: true
    - name: Ethernet0/1
      address_family:
        - afi: ipv4
          network:
            point_to_point: true
    - name: Ethernet0/2
      address_family:
        - afi: ipv4
          network:
            point_to_point: true
    - name: Ethernet0/3
      address_family:
        - afi: ipv4
          network:
            point_to_point: true

ospfv2:
  config:
    processes:
      - process_id: 1
        prefix_suppression: true
        network:
          - address: 121.160.0.2
            wildcard_bits: 0.0.0.0
            area: "0"
          - address: 121.160.42.0
            wildcard_bits: 0.0.0.255
            area: "0"

bgp_global:
  config:
    as_number: "{{ bgp_as }}"
    bgp:
      log_neighbor_changes: true
    networks:
      - address: 121.160.1.0
        netmask: 255.255.255.252
    neighbors:
      - neighbor_address: 121.160.0.6
        remote_as: "{{ bgp_as }}"
        update_source: Loopback0
        next_hop_self:
          set: true
