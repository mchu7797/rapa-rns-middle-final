---
# KT_1 — 국제 피어링 라우터 (AT&T IXP 접속)
interfaces:
  - { name: Loopback0,   ipv4: 121.160.0.1,  mask: 255.255.255.255, description: "Router-ID / iBGP update-source" }
  - { name: Ethernet0/0, ipv4: 123.45.67.41, mask: 255.255.255.248, description: "International Peering @ IXP (eBGP to AT&T)" }
  - { name: Ethernet0/1, ipv4: 121.160.42.1, mask: 255.255.255.252, ospf_network: point-to-point }
  - { name: Ethernet0/2, ipv4: 121.160.42.5, mask: 255.255.255.252, ospf_network: point-to-point }

ospf_passive_interfaces:
  - Ethernet0/0
ospf_networks:
  - { prefix: 121.160.0.1,  wildcard: 0.0.0.0,   area: 0 }
  - { prefix: 121.160.42.0, wildcard: 0.0.0.255, area: 0 }

bgp_neighbors:
  - { ip: 121.160.0.6,  remote_as: 1111, update_source: Loopback0, next_hop_self: true, description: "iBGP to KT_6 (RR)" }
  - { ip: 123.45.67.45, remote_as: 123,  description: "eBGP to AT&T R4" }
  - { ip: 123.45.67.46, remote_as: 123,  description: "eBGP to AT&T R6" }
