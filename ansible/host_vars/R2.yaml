hostname: R2

interfaces:
  config:
    - name: Ethernet0/0
      description: TO_R1
      enabled: true
    - name: Ethernet0/1
      description: TO_R4
      enabled: true
    - name: Ethernet0/2
      description: TO_R6
      enabled: true
    - name: Loopback0
      description: R2_Loopback
      enabled: true
    # unused ports
    - name: Ethernet0/3
      enabled: false
    - name: Ethernet1/0
      enabled: false
    - name: Ethernet1/1
      enabled: false
    - name: Ethernet1/2
      enabled: false
    - name: Ethernet1/3
      enabled: false
    - name: Ethernet2/0
      enabled: false
    - name: Ethernet2/1
      enabled: false
    - name: Ethernet2/2
      enabled: false
    - name: Ethernet2/3
      enabled: false

l3_interfaces:
  config:
    - name: Ethernet0/0
      ipv4:
        - address: 123.45.67.2/30
    - name: Ethernet0/1
      ipv4:
        - address: 123.45.67.9/30
    - name: Ethernet0/2
      ipv4:
        - address: 123.45.67.13/30
    - name: Loopback0
      ipv4:
        - address: 123.45.0.2/32

ospf_interfaces:
  config:
    - name: Ethernet0/0
      address_family:
        - afi: ipv4
          network:
            point_to_point: true
    - name: Ethernet0/1
      address_family:
        - afi: ipv4
          network:
            point_to_point: true
    - name: Ethernet0/2
      address_family:
        - afi: ipv4
          network:
            point_to_point: true

ospfv2:
  config:
    processes:
      - process_id: 1
        prefix_suppression: true
        network:
          - address: 123.45.0.2
            wildcard_bits: 0.0.0.0
            area: "0"
          - address: 123.45.67.0
            wildcard_bits: 0.0.0.255
            area: "0"

bgp_global:
  config:
    as_number: "{{ bgp_as }}"
    bgp:
      log_neighbor_changes: true
    neighbors:
      - neighbor_address: 123.45.0.1
        remote_as: "{{ bgp_as }}"
        update_source: Loopback0
      - neighbor_address: 123.45.0.4
        remote_as: "{{ bgp_as }}"
        update_source: Loopback0
        route_reflector_client: true
      - neighbor_address: 123.45.0.6
        remote_as: "{{ bgp_as }}"
        update_source: Loopback0
        route_reflector_client: true
