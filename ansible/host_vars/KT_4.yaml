hostname: KT_4

interfaces:
  config:
    - name: Loopback0
      description: KT_4_Loopback
      enabled: true
    - name: Ethernet0/0
      description: TO_KT_5
      enabled: true
    - name: Ethernet0/3
      description: TO_KT_2
      enabled: true
    - name: Ethernet1/0
      description: CUSTOMER_121.160.2.64
      enabled: true
    # unused ports
    - name: Ethernet2/0
      enabled: false
    - name: Ethernet2/1
      enabled: false
    - name: Ethernet2/2
      enabled: false
    - name: Ethernet2/3
      enabled: false

l3_interfaces:
  config:
    - name: Loopback0
      ipv4:
        - address: 121.160.0.4/32
    - name: Ethernet0/0
      ipv4:
        - address: 121.160.42.81/30
    - name: Ethernet0/3
      ipv4:
        - address: 121.160.42.66/30
    - name: Ethernet1/0
      ipv4:
        - address: 121.160.2.126/26

ospf_interfaces:
  config:
    - name: Ethernet0/0
      address_family:
        - afi: ipv4
          network:
            point_to_point: true
    - name: Ethernet0/3
      address_family:
        - afi: ipv4
          network:
            point_to_point: true

ospfv2:
  config:
    processes:
      - process_id: 1
        prefix_suppression: true
        network:
          - address: 121.160.0.4
            wildcard_bits: 0.0.0.0
            area: "0"
          - address: 121.160.42.0
            wildcard_bits: 0.0.0.255
            area: "0"

bgp_global:
  config:
    as_number: "{{ bgp_as }}"
    bgp:
      log_neighbor_changes: true
    networks:
      - address: 121.160.2.64
        netmask: 255.255.255.192
    neighbors:
      - neighbor_address: 121.160.0.6
        remote_as: "{{ bgp_as }}"
        update_source: Loopback0
        next_hop_self:
          set: true
