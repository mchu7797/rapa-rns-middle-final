---
# 자격증명 예시 파일. 실제 값으로 채운 뒤 암호화/주입해 사용한다.
#
#   방법 A) 그대로 전달
#     ansible-playbook site.yml -e @secrets.yml
#
#   방법 B) Vault 로 암호화 후 group_vars 로 상속
#     cp secrets.example.yml group_vars/all/vault.yml
#     ansible-vault encrypt group_vars/all/vault.yml
#     ansible-playbook site.yml --ask-vault-pass
#
vault_ansible_user: admin
vault_ansible_password: "CHANGE_ME"
vault_enable_password: "CHANGE_ME"
